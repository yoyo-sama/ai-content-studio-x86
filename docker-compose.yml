# Application stack only (web + updater). ComfyUI and Ollama live in their own stacks
# at the root of the home directory: ~/comfyui and ~/ollama, deployed by the installers
# from docker/stacks/. nginx runs in host network mode, so it reaches both on 127.0.0.1.
services:
  ai-content-studio:
    image: nginx:alpine
    container_name: ai-content-studio-web
    network_mode: host
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  updater:
    build: ./docker/updater
    container_name: ai-content-studio-updater
    network_mode: host
    environment:
      - REPO_DIR=/repo
    volumes:
      - ./:/repo:rw
    restart: unless-stopped
